<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoS // Chief of Staff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <div class="crt-overlay"></div>
  <div class="vignette"></div>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <button id="new-chat" class="new-chat-btn" type="button">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          Новый чат
        </button>
      </div>
      <div id="chat-list" class="chat-list"></div>
    </aside>

    <main class="main">
      <header class="main-header">
        <select id="model-select" class="model-select" aria-label="Модель"></select>
        <a href="/voice" class="voice-link" title="Голосовой чат">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="1" width="6" height="11" rx="3"/>
            <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </a>
      </header>
      <div class="token-panel">
        <div class="token-bar" id="token-bar" title="Нажмите для подробностей">
          <div class="token-stat">
            <span class="label">Вход:</span>
            <span class="value" id="tb-input">—</span>
          </div>
          <div class="token-stat">
            <span class="label">Выход:</span>
            <span class="value" id="tb-output">—</span>
          </div>
          <div class="token-stat">
            <span class="label">Кэш:</span>
            <span class="value" id="tb-cache">—</span>
          </div>
          <div class="context-meter">
            <div class="context-meter-fill" id="tb-meter" style="width:0%"></div>
          </div>
          <span id="tb-percent" style="font-variant-numeric:tabular-nums">0%</span>
        </div>
        <div class="token-details" id="token-details">
          <div class="token-details-grid">
            <div class="token-details-section">
              <h4>Последний запрос</h4>
              <div class="token-row"><span>Входные токены</span><span class="val" id="td-req-input">0</span></div>
              <div class="token-row"><span>Выходные токены</span><span class="val" id="td-req-output">0</span></div>
              <div class="token-row"><span>Записано в кэш</span><span class="val" id="td-req-cache-write">0</span></div>
              <div class="token-row"><span>Прочитано из кэша</span><span class="val" id="td-req-cache-read">0</span></div>
              <div class="token-row" style="margin-top:4px;border-top:1px solid var(--line);padding-top:4px">
                <span>Эффективный вход</span>
                <span class="val" id="td-req-effective">0</span>
              </div>
            </div>
            <div class="token-details-section">
              <h4>За сессию (всего)</h4>
              <div class="token-row"><span>Входные токены</span><span class="val" id="td-cum-input">0</span></div>
              <div class="token-row"><span>Выходные токены</span><span class="val" id="td-cum-output">0</span></div>
              <div class="token-row"><span>Записано в кэш</span><span class="val" id="td-cum-cache-write">0</span></div>
              <div class="token-row"><span>Прочитано из кэша</span><span class="val" id="td-cum-cache-read">0</span></div>
              <div class="token-row" style="margin-top:4px;border-top:1px solid var(--line);padding-top:4px">
                <span>Запросов</span>
                <span class="val" id="td-cum-count">0</span>
              </div>
            </div>
          </div>
          <div class="token-details-section" style="margin-top:10px">
            <h4>Контекстное окно</h4>
            <div class="token-row"><span>Модель</span><span class="val" id="td-ctx-model">—</span></div>
            <div class="token-row"><span>Окно</span><span class="val" id="td-ctx-window">—</span></div>
            <div class="token-row"><span>Использовано</span><span class="val" id="td-ctx-used">—</span></div>
            <div class="token-row"><span>Осталось</span><span class="val" id="td-ctx-remain">—</span></div>
          </div>
          <div id="td-warning"></div>
        </div>
      </div>
      <div id="transcript"></div>
      <div id="composer">
        <div class="pill">
          <div class="field">
            <textarea id="input" rows="1" autocomplete="off"></textarea>
            <div id="ghost"></div>
          </div>
          <button id="send" aria-label="Отправить">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5" />
              <path d="M5 12l7-7 7 7" />
            </svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API = "";

    const PLACEHOLDERS = [
      "Спроси что-нибудь у Claude…",
      "Объясни концепцию простыми словами",
      "Помоги с кодом на Python",
      "Сделай краткое содержание текста",
      "Придумай идеи для проекта",
    ];

    const MODELS = [
      { id: "claude-opus-4-7",   label: "Claude Opus 4.7" },
      { id: "claude-opus-4-6",   label: "Claude Opus 4.6" },
      { id: "claude-sonnet-4-6", label: "Claude Sonnet 4.6" },
      { id: "claude-haiku-4-5",  label: "Claude Haiku 4.5" },
    ];
    const DEFAULT_MODEL = "claude-opus-4-6";

    const PIN_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8l-2 5v3l3 2H7l3-2V9L8 4z"/><line x1="12" y1="14" x2="12" y2="20"/></svg>';
    const TRASH_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';

    const transcriptEl  = document.getElementById("transcript");
    const chatListEl    = document.getElementById("chat-list");
    const inputEl       = document.getElementById("input");
    const ghostEl       = document.getElementById("ghost");
    const sendBtn       = document.getElementById("send");
    const newChatBtn    = document.getElementById("new-chat");
    const modelSelectEl = document.getElementById("model-select");

    for (const m of MODELS) {
      const opt = document.createElement("option");
      opt.value = m.id;
      opt.textContent = m.label;
      modelSelectEl.appendChild(opt);
    }

    /* ========================================================
       State: server-backed via /api/chats
       ======================================================== */
    let chatsList = [];
    let currentId = null;
    let currentMessages = [];

    function deriveTitle(text) {
      const t = (text || "").trim().replace(/\s+/g, " ");
      if (!t) return "";
      return t.length > 40 ? t.slice(0, 40) + "…" : t;
    }

    async function api(method, path, body) {
      const opts = { method, headers: { "Content-Type": "application/json" } };
      if (body !== undefined) opts.body = JSON.stringify(body);
      const res = await fetch(API + path, opts);
      return res.json();
    }

    async function loadChats() {
      chatsList = await api("GET", "/api/chats");
      if (chatsList.length === 0) {
        const { id } = await api("POST", "/api/chats", { model: DEFAULT_MODEL });
        chatsList = await api("GET", "/api/chats");
      }
      if (!currentId || !chatsList.find(c => c.id === currentId)) {
        currentId = chatsList[0].id;
      }
    }

    async function loadCurrentChat() {
      const data = await api("GET", `/api/chats/${currentId}`);
      currentMessages = data.messages || [];
    }

    function currentChatMeta() {
      return chatsList.find(c => c.id === currentId);
    }

    async function createNewChat() {
      const empty = chatsList.find(c => !c.title);
      if (empty) {
        await switchChat(empty.id);
        return;
      }
      const model = modelSelectEl.value || DEFAULT_MODEL;
      const { id } = await api("POST", "/api/chats", { model });
      currentId = id;
      await loadChats();
      currentMessages = [];
      renderAll();
      inputEl.focus();
    }

    async function switchChat(id) {
      currentId = id;
      await loadCurrentChat();
      renderAll();
    }

    async function deleteChat(id) {
      if (!confirm("Удалить этот чат? Действие нельзя отменить.")) return;
      await api("DELETE", `/api/chats/${id}`);
      if (currentId === id) currentId = null;
      await loadChats();
      await loadCurrentChat();
      renderAll();
    }

    async function togglePin(id) {
      const c = chatsList.find(c => c.id === id);
      if (!c) return;
      await api("PATCH", `/api/chats/${id}`, { pinned: !c.pinned });
      await loadChats();
      renderSidebar();
    }

    /* ========================================================
       Rendering
       ======================================================== */
    function renderSidebar() {
      chatListEl.innerHTML = "";
      for (const c of chatsList) {
        const item = document.createElement("div");
        item.className = "chat-item"
          + (c.id === currentId ? " active" : "")
          + (c.pinned ? " pinned" : "");

        const title = document.createElement("div");
        title.className = "chat-item-title";
        title.textContent = c.title || "Новый чат";
        item.appendChild(title);

        const actions = document.createElement("div");
        actions.className = "chat-item-actions";

        const pinBtn = document.createElement("button");
        pinBtn.className = "icon-btn pin-btn";
        pinBtn.type = "button";
        pinBtn.title = c.pinned ? "Открепить" : "Закрепить";
        pinBtn.innerHTML = PIN_SVG;
        pinBtn.addEventListener("click", (e) => { e.stopPropagation(); togglePin(c.id); });

        const trashBtn = document.createElement("button");
        trashBtn.className = "icon-btn trash-btn";
        trashBtn.type = "button";
        trashBtn.title = "Удалить";
        trashBtn.innerHTML = TRASH_SVG;
        trashBtn.addEventListener("click", (e) => { e.stopPropagation(); deleteChat(c.id); });

        actions.appendChild(pinBtn);
        actions.appendChild(trashBtn);
        item.appendChild(actions);

        item.addEventListener("click", () => switchChat(c.id));

        chatListEl.appendChild(item);
      }
    }

    function showEmptyState() {
      const empty = document.createElement("div");
      empty.id = "empty";
      const strong = document.createElement("strong");
      strong.textContent = "Чат с Claude";
      empty.appendChild(strong);
      empty.appendChild(document.createTextNode("Напиши сообщение — Claude помнит весь диалог."));
      transcriptEl.appendChild(empty);
    }

    function renderTranscript() {
      transcriptEl.innerHTML = "";
      if (currentMessages.length === 0) {
        showEmptyState();
        return;
      }
      for (const m of currentMessages) addBubble(m.role, m.content);
    }

    function syncModelSelect() {
      const c = currentChatMeta();
      modelSelectEl.value = (c && c.model) || DEFAULT_MODEL;
    }

    function renderAll() { renderSidebar(); renderTranscript(); syncModelSelect(); }

    /* ========================================================
       Markdown
       ======================================================== */
    function renderMarkdown(text) {
      return DOMPurify.sanitize(marked.parse(text || "", { breaks: true, gfm: true }));
    }

    function addBubble(role, text) {
      const empty = transcriptEl.querySelector("#empty");
      if (empty) empty.remove();

      const el = document.createElement("div");
      el.className = "msg " + (role === "user" ? "user" : "bot");
      if (role === "user") {
        el.textContent = text;
      } else {
        el.innerHTML = renderMarkdown(text);
      }
      transcriptEl.appendChild(el);
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
      return el;
    }

    function showTyping() {
      const empty = transcriptEl.querySelector("#empty");
      if (empty) empty.remove();
      const el = document.createElement("div");
      el.className = "msg bot";
      el.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
      transcriptEl.appendChild(el);
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
      return el;
    }

    /* ========================================================
       Animated placeholder
       ======================================================== */
    let phraseIdx = 0;
    ghostEl.textContent = PLACEHOLDERS[0];

    function refreshGhost() {
      const idle = !inputEl.value && document.activeElement !== inputEl;
      ghostEl.classList.toggle("hide", !idle);
    }
    setInterval(() => {
      if (inputEl.value || document.activeElement === inputEl) return;
      ghostEl.classList.add("swap");
      setTimeout(() => {
        phraseIdx = (phraseIdx + 1) % PLACEHOLDERS.length;
        ghostEl.textContent = PLACEHOLDERS[phraseIdx];
        ghostEl.classList.remove("swap");
      }, 350);
    }, 3000);

    inputEl.addEventListener("focus", refreshGhost);
    inputEl.addEventListener("blur", refreshGhost);
    inputEl.addEventListener("input", () => {
      refreshGhost();
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
    });

    /* ========================================================
       Send message
       ======================================================== */
    async function send() {
      const text = inputEl.value.trim();
      if (!text || !currentId) return;

      addBubble("user", text);
      currentMessages.push({ role: "user", content: text });

      await api("POST", `/api/chats/${currentId}/messages`, { role: "user", content: text });

      const meta = currentChatMeta();
      if (meta && !meta.title) {
        const title = deriveTitle(text);
        await api("PATCH", `/api/chats/${currentId}`, { title });
        await loadChats();
        renderSidebar();
      }

      inputEl.value = "";
      inputEl.style.height = "auto";
      refreshGhost();
      sendBtn.disabled = true;

      const typingEl = showTyping();
      let fullText = "";

      try {
        const res = await fetch(API + "/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chat_id: currentId, model: meta?.model }),
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop();

          for (const part of parts) {
            if (!part.startsWith("data: ")) continue;
            try {
              const data = JSON.parse(part.slice(6));
              if (data.type === "text") {
                fullText += data.chunk;
                typingEl.innerHTML = renderMarkdown(fullText);
                transcriptEl.scrollTop = transcriptEl.scrollHeight;
              }
              if (data.type === "usage") {
                updateTokenPanel(data);
              }
              if (data.type === "error") {
                typingEl.textContent = "Ошибка: " + data.message;
              }
            } catch {}
          }
        }

        if (fullText) {
          currentMessages.push({ role: "assistant", content: fullText });
          await loadChats();
          renderSidebar();
        }
      } catch (e) {
        typingEl.textContent = "Не удалось связаться с сервером: " + e;
      } finally {
        sendBtn.disabled = false;
        transcriptEl.scrollTop = transcriptEl.scrollHeight;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener("click", send);
    newChatBtn.addEventListener("click", createNewChat);

    modelSelectEl.addEventListener("change", () => {
      if (!currentId) return;
      api("PATCH", `/api/chats/${currentId}`, { model: modelSelectEl.value });
      const c = currentChatMeta();
      if (c) c.model = modelSelectEl.value;
    });

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    /* ========================================================
       Migration from localStorage → server
       ======================================================== */
    async function migrateFromLocalStorage() {
      const STORAGE_KEY = "claude_chat_v2";
      const OLD_KEY = "claude_chat_history";
      let raw = null;

      try { raw = localStorage.getItem(STORAGE_KEY); } catch {}
      if (!raw) {
        try {
          const oldRaw = localStorage.getItem(OLD_KEY);
          if (oldRaw) {
            const msgs = JSON.parse(oldRaw);
            if (msgs.length > 0) {
              const now = Date.now();
              const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
              raw = JSON.stringify({
                currentId: id,
                chats: { [id]: { id, title: "", pinned: false, createdAt: now, updatedAt: now, messages: msgs, model: DEFAULT_MODEL } }
              });
            }
          }
        } catch {}
      }

      if (!raw) return;

      try {
        const state = JSON.parse(raw);
        if (!state || !state.chats) return;

        const chats = Object.values(state.chats)
          .filter(c => c.messages && c.messages.length > 0)
          .map(c => ({
            id: c.id,
            title: c.title || "",
            pinned: !!c.pinned,
            model: c.model || DEFAULT_MODEL,
            createdAt: c.createdAt || Date.now(),
            updatedAt: c.updatedAt || Date.now(),
            messages: c.messages,
          }));

        if (chats.length === 0) {
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem(OLD_KEY);
          return;
        }

        await api("POST", "/api/migrate", { chats });
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(OLD_KEY);
        console.log(`Migrated ${chats.length} chat(s) to server.`);
      } catch (e) {
        console.error("Migration failed:", e);
      }
    }

    /* ========================================================
       Token panel
       ======================================================== */
    const tokenBar = document.getElementById("token-bar");
    const tokenDetails = document.getElementById("token-details");

    tokenBar.addEventListener("click", () => {
      tokenDetails.classList.toggle("open");
    });

    function fmtNum(n) {
      if (n == null) return "—";
      if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + "M";
      if (n >= 1_000) return (n / 1_000).toFixed(1) + "K";
      return String(n);
    }

    function updateTokenPanel(data) {
      if (!data || !data.last_request) return;
      const req = data.last_request;
      const cum = data.cumulative;
      const ctx = data.context;

      // Top bar
      document.getElementById("tb-input").textContent = fmtNum(req.input_tokens);
      document.getElementById("tb-output").textContent = fmtNum(req.output_tokens);

      const cacheRead = req.cache_read_input_tokens || 0;
      const tbCache = document.getElementById("tb-cache");
      if (cacheRead > 0) {
        tbCache.innerHTML = '<span class="cache-badge hit">HIT ' + fmtNum(cacheRead) + '</span>';
      } else {
        tbCache.innerHTML = '<span class="cache-badge miss">MISS</span>';
      }

      const pct = ctx ? ctx.usage_percent : 0;
      const meter = document.getElementById("tb-meter");
      meter.style.width = pct + "%";
      meter.className = "context-meter-fill" + (pct > 75 ? " high" : pct > 50 ? " moderate" : "");
      document.getElementById("tb-percent").textContent = pct + "%";

      // Details: last request
      document.getElementById("td-req-input").textContent = fmtNum(req.input_tokens);
      document.getElementById("td-req-output").textContent = fmtNum(req.output_tokens);
      document.getElementById("td-req-cache-write").textContent = fmtNum(req.cache_creation_input_tokens);
      document.getElementById("td-req-cache-read").textContent = fmtNum(cacheRead);
      const effective = req.input_tokens - cacheRead;
      document.getElementById("td-req-effective").textContent = fmtNum(effective);

      // Details: cumulative
      if (cum) {
        document.getElementById("td-cum-input").textContent = fmtNum(cum.total_input);
        document.getElementById("td-cum-output").textContent = fmtNum(cum.total_output);
        document.getElementById("td-cum-cache-write").textContent = fmtNum(cum.total_cache_creation);
        document.getElementById("td-cum-cache-read").textContent = fmtNum(cum.total_cache_read);
        document.getElementById("td-cum-count").textContent = cum.request_count;
      }

      // Details: context window
      if (ctx) {
        document.getElementById("td-ctx-model").textContent = ctx.model;
        document.getElementById("td-ctx-window").textContent = fmtNum(ctx.context_window);
        document.getElementById("td-ctx-used").textContent = fmtNum(ctx.tokens_used);
        document.getElementById("td-ctx-remain").textContent = fmtNum(ctx.tokens_remaining);

        const warningEl = document.getElementById("td-warning");
        if (ctx.warning) {
          const level = ctx.usage_percent > 75 ? "high" : "moderate";
          warningEl.className = "token-warning " + level;
          warningEl.textContent = ctx.warning;
        } else {
          warningEl.className = "";
          warningEl.textContent = "";
        }
      }
    }

    /* ========================================================
       Init
       ======================================================== */
    (async () => {
      await migrateFromLocalStorage();
      await loadChats();
      await loadCurrentChat();
      renderAll();
    })();
  </script>
</body>
</html>
