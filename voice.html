<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoS — Голосовой чат</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="/agent.js"></script>
</head>
<body class="voice-page">
  <div class="crt-overlay"></div>
  <div class="vignette"></div>

  <div class="header">
    <div class="runline top"></div>
    <a href="/" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
      </svg>
      Текстовый чат
    </a>
    <span class="header-title">
      <span class="glitch flicker" data-text="ГОЛОС">ГОЛОС</span>
      <span class="mono" style="font-size:10px;color:var(--ink-2);margin-left:8px">// VOICE.LINK</span>
    </span>
    <button class="clear-btn" onclick="clearHistory()">Очистить</button>
  </div>

  <div id="transcript"></div>

  <div class="controls" id="controls">
    <div class="holo-container" id="holo-face"></div>
    <div id="status">Нажми, чтобы начать разговор</div>
    <div id="live-text"></div>
    <button class="mic-btn" id="mic-btn" onclick="toggleSession()">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="1" width="6" height="11" rx="3"/>
        <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <div class="hint" id="hint"></div>
    <div class="wakeword-bar" id="wakeword-bar">
      <button class="wakeword-toggle" id="wakeword-toggle" type="button" title="Включить/выключить кодовую фразу">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
      <span class="wakeword-label" id="wakeword-label"></span>
      <button class="wakeword-edit-btn" id="wakeword-edit-btn" type="button" title="Настроить фразу">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
    <div class="wakeword-settings" id="wakeword-settings">
      <label class="wakeword-settings-label">Кодовая фраза</label>
      <div class="wakeword-settings-row">
        <input type="text" class="wakeword-input" id="wakeword-input" placeholder="например: привет штаб" autocomplete="off" />
        <button class="wakeword-save" id="wakeword-save" type="button">OK</button>
      </div>
    </div>
    <div class="text-input-row" id="text-input-row">
      <input type="text" id="voice-text-input" placeholder="Напиши сообщение..." autocomplete="off" />
      <button class="send-btn" id="voice-send-btn" onclick="sendTextMessage()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const hasSpeech = !!SpeechRecognition;
    if (!hasSpeech) {
      document.getElementById("mic-btn").style.display = "none";
      document.getElementById("hint").style.display = "none";
      document.getElementById("text-input-row").style.display = "flex";
      document.getElementById("status").textContent = "Голосовой ввод недоступен — пиши текстом";
    }

    const API = "";
    const VOICE_CHAT_TITLE = "__voice__";

    const transcriptEl = document.getElementById("transcript");
    const statusEl = document.getElementById("status");
    const micBtn = document.getElementById("mic-btn");
    const liveTextEl = document.getElementById("live-text");
    const hintEl = document.getElementById("hint");

    let chatId = null;
    let messages = [];
    let recognition = null;
    let sessionActive = false;
    let busy = false;
    let currentAudio = null;
    let audioCtx = null;

    // HoloFace
    let holoFace = null;
    const holoContainer = document.getElementById("holo-face");
    if (holoContainer && typeof createHoloFace === "function") {
      holoFace = createHoloFace(holoContainer, { size: 220, state: "idle" });
    }

    function setHoloState(state) {
      if (holoFace) holoFace.setState(state);
    }

    async function apiCall(method, path, body) {
      const opts = { method, headers: { "Content-Type": "application/json" } };
      if (body !== undefined) opts.body = JSON.stringify(body);
      const res = await fetch(API + path, opts);
      return res.json();
    }

    async function ensureVoiceChat() {
      const chats = await apiCall("GET", "/api/chats");
      const existing = chats.find(c => c.title === VOICE_CHAT_TITLE);
      if (existing) {
        chatId = existing.id;
      } else {
        const { id } = await apiCall("POST", "/api/chats", { title: VOICE_CHAT_TITLE, model: "claude-haiku-4-5" });
        chatId = id;
      }
      const data = await apiCall("GET", `/api/chats/${chatId}`);
      messages = data.messages || [];
    }

    async function migrateVoiceLocalStorage() {
      const STORAGE_KEY = "cos_voice_history";
      let raw = null;
      try { raw = localStorage.getItem(STORAGE_KEY); } catch {}
      if (!raw) return;
      try {
        const msgs = JSON.parse(raw);
        if (!msgs || msgs.length === 0) return;
        await ensureVoiceChat();
        for (const m of msgs) {
          await apiCall("POST", `/api/chats/${chatId}/messages`, { role: m.role, content: m.content });
        }
        localStorage.removeItem(STORAGE_KEY);
        console.log(`Migrated ${msgs.length} voice message(s) to server.`);
      } catch (e) {
        console.error("Voice migration failed:", e);
      }
    }

    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function renderMarkdown(text) {
      return DOMPurify.sanitize(marked.parse(text || "", { breaks: true, gfm: true }));
    }

    async function clearHistory() {
      if (messages.length === 0) return;
      if (!confirm("Очистить историю голосового чата?")) return;
      if (chatId) {
        await apiCall("DELETE", `/api/chats/${chatId}`);
        chatId = null;
      }
      messages = [];
      await ensureVoiceChat();
      renderTranscript();
    }

    function updateUI(state, text) {
      statusEl.classList.remove("error");
      micBtn.classList.remove("listening", "processing");
      micBtn.disabled = false;
      hintEl.textContent = "";
      liveTextEl.textContent = "";
      const sendBtn = document.getElementById("voice-send-btn");
      const textInput = document.getElementById("voice-text-input");
      if (sendBtn) sendBtn.disabled = false;
      if (textInput) textInput.disabled = false;

      switch (state) {
        case "idle":
          statusEl.textContent = hasSpeech ? "Нажми, чтобы начать разговор" : "";
          setHoloState("idle");
          break;
        case "listening":
          statusEl.textContent = "Слушаю... говори свободно";
          micBtn.classList.add("listening");
          hintEl.textContent = "Нажми ещё раз, чтобы завершить";
          setHoloState("listening");
          break;
        case "processing":
          statusEl.textContent = "Думаю...";
          micBtn.classList.add("processing");
          micBtn.disabled = true;
          if (sendBtn) sendBtn.disabled = true;
          if (textInput) textInput.disabled = true;
          setHoloState("thinking");
          break;
        case "speaking":
          statusEl.textContent = "Говорю...";
          micBtn.disabled = true;
          if (sendBtn) sendBtn.disabled = true;
          if (textInput) textInput.disabled = true;
          setHoloState("speaking");
          break;
        case "error":
          statusEl.textContent = text || "Ошибка";
          statusEl.classList.add("error");
          setHoloState("alert");
          break;
      }
    }

    const AVATAR_SVG = `<svg viewBox="0 0 200 240" width="100%" height="100%" style="filter:drop-shadow(0 0 4px rgba(0,240,255,.5))">
      <polygon points="100,18 48,48 30,110 38,142 80,178 100,222 120,178 162,142 170,110 152,48" fill="rgba(0,240,255,.04)" stroke="rgba(0,240,255,.55)" stroke-width="3" stroke-linejoin="round"/>
      <line x1="100" y1="18" x2="48" y2="48" stroke="rgba(0,240,255,.3)" stroke-width="1.5"/>
      <line x1="100" y1="18" x2="152" y2="48" stroke="rgba(0,240,255,.3)" stroke-width="1.5"/>
      <line x1="100" y1="18" x2="100" y2="138" stroke="rgba(0,240,255,.2)" stroke-width="1"/>
      <line x1="48" y1="48" x2="100" y2="68" stroke="rgba(0,240,255,.25)" stroke-width="1"/>
      <line x1="152" y1="48" x2="100" y2="68" stroke="rgba(0,240,255,.25)" stroke-width="1"/>
      <line x1="30" y1="110" x2="100" y2="68" stroke="rgba(0,240,255,.18)" stroke-width="1"/>
      <line x1="170" y1="110" x2="100" y2="68" stroke="rgba(0,240,255,.18)" stroke-width="1"/>
      <line x1="38" y1="142" x2="100" y2="138" stroke="rgba(0,240,255,.15)" stroke-width="1"/>
      <line x1="162" y1="142" x2="100" y2="138" stroke="rgba(0,240,255,.15)" stroke-width="1"/>
      <line x1="80" y1="178" x2="100" y2="138" stroke="rgba(0,240,255,.15)" stroke-width="1"/>
      <line x1="120" y1="178" x2="100" y2="138" stroke="rgba(0,240,255,.15)" stroke-width="1"/>
      <circle cx="100" cy="68" r="4" fill="rgba(0,240,255,.45)"/>
      <circle cx="100" cy="138" r="3" fill="rgba(0,240,255,.35)"/>
    </svg>`;

    function addBubble(role, text) {
      const empty = transcriptEl.querySelector("#empty");
      if (empty) empty.remove();

      if (role === "user") {
        const wrap = document.createElement("div");
        wrap.className = "msg-wrap user";
        const msg = document.createElement("div");
        msg.className = "msg user";
        msg.textContent = text;
        wrap.appendChild(msg);
        transcriptEl.appendChild(wrap);
      } else {
        const wrap = document.createElement("div");
        wrap.className = "msg-wrap bot";
        const avatar = document.createElement("div");
        avatar.className = "msg-avatar";
        avatar.innerHTML = AVATAR_SVG;
        wrap.appendChild(avatar);
        const body = document.createElement("div");
        body.className = "msg-body";
        const meta = document.createElement("div");
        meta.className = "msg-meta";
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        meta.innerHTML = '<span class="badge">CoS</span><span class="time">' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + '</span>';
        body.appendChild(meta);
        const msg = document.createElement("div");
        msg.className = "msg bot";
        msg.innerHTML = renderMarkdown(text);
        body.appendChild(msg);
        wrap.appendChild(body);
        transcriptEl.appendChild(wrap);
      }

      transcriptEl.scrollTop = transcriptEl.scrollHeight;
      return transcriptEl.lastElementChild.querySelector('.msg') || transcriptEl.lastElementChild;
    }

    function renderTranscript() {
      transcriptEl.innerHTML = "";
      if (messages.length === 0) {
        const empty = document.createElement("div");
        empty.id = "empty";
        const strong = document.createElement("strong");
        strong.textContent = "ГОЛОС // CoS";
        empty.appendChild(strong);
        empty.appendChild(document.createTextNode("Нажми на микрофон и начни говорить свободно."));
        transcriptEl.appendChild(empty);
        return;
      }
      for (const m of messages) addBubble(m.role, m.content);
    }

    function createRecognition() {
      const rec = new SpeechRecognition();
      rec.lang = "ru-RU";
      rec.continuous = true;
      rec.interimResults = true;

      let finalTranscript = "";
      let silenceTimer = null;

      const EXIT_PHRASE = "завершить чат";

      rec.onresult = (e) => {
        if (busy) return;

        let interim = "";
        finalTranscript = "";

        for (let i = 0; i < e.results.length; i++) {
          const result = e.results[i];
          if (result.isFinal) {
            finalTranscript += result[0].transcript;
          } else {
            interim += result[0].transcript;
          }
        }

        liveTextEl.textContent = finalTranscript + interim;

        const combined = (finalTranscript + interim).toLowerCase().replace(/[.,!?;:]/g, '').trim();
        if (combined.includes(EXIT_PHRASE)) {
          clearTimeout(silenceTimer);
          rec.stop();
          liveTextEl.textContent = "";
          stopSession();
          window.location.href = "/";
          return;
        }

        clearTimeout(silenceTimer);
        if (finalTranscript.trim()) {
          silenceTimer = setTimeout(() => {
            if (finalTranscript.trim() && !busy) {
              const text = finalTranscript.trim();
              rec.stop();
              processVoice(text);
            }
          }, 1500);
        }
      };

      rec.onend = () => {
        if (sessionActive && !busy) {
          try { rec.start(); } catch {}
        }
      };

      rec.onerror = (e) => {
        if (e.error === "not-allowed") {
          updateUI("error", "Нет доступа к микрофону. Разреши в настройках браузера.");
          sessionActive = false;
        } else if (e.error !== "no-speech" && e.error !== "aborted") {
          console.warn("Speech recognition error:", e.error);
        }
      };

      return rec;
    }

    function startSession() {
      if (!SpeechRecognition) return;
      recognition = createRecognition();
      try {
        recognition.start();
        sessionActive = true;
        updateUI("listening");
      } catch (e) {
        updateUI("error", "Не удалось запустить распознавание");
      }
    }

    function stopSession() {
      sessionActive = false;
      if (recognition) {
        recognition.abort();
        recognition = null;
      }
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      updateUI("idle");
    }

    function toggleSession() {
      unlockAudio();
      if (sessionActive) {
        stopSession();
      } else {
        startSession();
      }
    }

    function sendTextMessage() {
      const input = document.getElementById("voice-text-input");
      const text = input.value.trim();
      if (!text || busy) return;
      input.value = "";
      unlockAudio();
      processVoice(text);
    }

    async function processVoice(userText) {
      busy = true;
      updateUI("processing");

      addBubble("user", userText);
      messages.push({ role: "user", content: userText });

      let botBubble = null;
      let fullText = "";

      const audioQueue = [];
      let playing = false;
      let streamEnded = false;
      let playbackDone = null;
      const playbackPromise = new Promise(r => { playbackDone = r; });

      async function drainAudio() {
        if (playing) return;
        playing = true;
        updateUI("speaking");
        while (audioQueue.length > 0) {
          const b64 = audioQueue.shift();
          await playAudio(b64);
        }
        playing = false;
        if (streamEnded && audioQueue.length === 0) {
          playbackDone();
        }
      }

      try {
        const resp = await fetch("/voice/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: userText, chat_id: chatId }),
        });

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop();

          for (const part of parts) {
            if (!part.startsWith("data: ")) continue;
            try {
              const data = JSON.parse(part.slice(6));

              if (data.type === "text") {
                fullText += data.chunk;
                if (!botBubble) {
                  botBubble = addBubble("assistant", fullText);
                } else {
                  botBubble.innerHTML = renderMarkdown(fullText);
                }
                transcriptEl.scrollTop = transcriptEl.scrollHeight;
              }

              if (data.type === "audio" && data.data) {
                audioQueue.push(data.data);
                drainAudio();
              }

              if (data.type === "done") {
                messages.push({ role: "assistant", content: data.full_text || fullText });
              }

              if (data.type === "error") {
                updateUI("error", data.message);
                busy = false;
                setTimeout(() => {
                  if (sessionActive) resumeListening();
                  else updateUI("idle");
                }, 3000);
                return;
              }
            } catch {}
          }
        }
      } catch (e) {
        updateUI("error", "Ошибка связи с сервером");
        busy = false;
        setTimeout(() => {
          if (sessionActive) resumeListening();
          else updateUI("idle");
        }, 3000);
        return;
      }

      streamEnded = true;
      if (!playing && audioQueue.length === 0) {
        playbackDone();
      }
      await playbackPromise;

      busy = false;
      if (sessionActive) {
        resumeListening();
      } else {
        updateUI("idle");
      }
    }

    function resumeListening() {
      if (!sessionActive) return;
      recognition = createRecognition();
      try {
        recognition.start();
        updateUI("listening");
      } catch {}
    }

    function playAudio(base64Audio) {
      return new Promise(async (resolve) => {
        try {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audioCtx.state === 'suspended') await audioCtx.resume();

          const bytes = Uint8Array.from(atob(base64Audio), c => c.charCodeAt(0));
          const audioBuffer = await audioCtx.decodeAudioData(bytes.buffer.slice(0));
          const source = audioCtx.createBufferSource();
          source.buffer = audioBuffer;
          source.connect(audioCtx.destination);
          source.onended = resolve;
          source.start();
        } catch (e) {
          console.warn("Audio playback error:", e);
          resolve();
        }
      });
    }

    (async () => {
      await migrateVoiceLocalStorage();
      await ensureVoiceChat();
      renderTranscript();

      const params = new URLSearchParams(window.location.search);
      if (params.get("wakeword") === "1") {
        history.replaceState(null, "", "/voice");
        unlockAudio();
        sessionActive = true;
        await processVoice("Привет");
      }
    })();

    const voiceInput = document.getElementById("voice-text-input");
    if (voiceInput) {
      voiceInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendTextMessage();
        }
      });
    }

    // ── Wake Word ──
    const wwToggle = document.getElementById("wakeword-toggle");
    const wwLabel = document.getElementById("wakeword-label");
    const wwEditBtn = document.getElementById("wakeword-edit-btn");
    const wwSettings = document.getElementById("wakeword-settings");
    const wwInput = document.getElementById("wakeword-input");
    const wwSave = document.getElementById("wakeword-save");
    const wwBar = document.getElementById("wakeword-bar");

    let wakeWord = null;
    if (typeof createWakeWordDetector === "function") {
      wakeWord = createWakeWordDetector({
        onDetected() {
          unlockAudio();
          if (!sessionActive && !busy) startSession();
        },
        onStateChange(state) {
          updateWakeWordUI();
        },
      });
    }

    function updateWakeWordUI() {
      if (!wakeWord) { wwBar.style.display = "none"; return; }
      const on = wakeWord.isEnabled();
      const phrase = wakeWord.getPhrase();
      wwToggle.classList.toggle("active", on);
      wwLabel.textContent = on
        ? "«" + phrase + "» — слушаю..."
        : "Кодовая фраза выкл.";
      wwBar.classList.toggle("active", on && wakeWord.isActive());
    }

    wwToggle.addEventListener("click", () => {
      if (!wakeWord) return;
      wakeWord.toggle();
      updateWakeWordUI();
    });

    wwEditBtn.addEventListener("click", () => {
      const open = wwSettings.classList.toggle("open");
      if (open) {
        wwInput.value = wakeWord ? wakeWord.getPhrase() : "";
        wwInput.focus();
      }
    });

    wwSave.addEventListener("click", saveWakePhrase);
    wwInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); saveWakePhrase(); }
    });

    function saveWakePhrase() {
      const val = wwInput.value.trim();
      if (!val || !wakeWord) return;
      wakeWord.setPhrase(val);
      wwSettings.classList.remove("open");
      updateWakeWordUI();
    }

    // Stop wake word when voice session starts, restart when it ends
    const _origStart = startSession;
    const _origStop = stopSession;
    startSession = function() {
      if (wakeWord) wakeWord.stop();
      _origStart();
    };
    stopSession = function() {
      _origStop();
      if (wakeWord && wakeWord.isEnabled()) wakeWord.start();
    };

    // Auto-start wake word if enabled
    if (wakeWord && wakeWord.isEnabled()) wakeWord.start();
    updateWakeWordUI();
  </script>
</body>
</html>
