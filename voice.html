<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoS — Голосовой чат</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fafafa;
      --ink: #0a0a0a;
      --muted: #8a8a8a;
      --card: #ffffff;
      --border: #ececec;
      --danger: #dc2626;
      --active: #22c55e;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      position: relative;
    }

    .back-link {
      color: var(--ink);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.15s;
    }
    .back-link:hover { opacity: 0.6; }

    .header-title {
      font-size: 16px;
      font-weight: 600;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .clear-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .clear-btn:hover { background: rgba(0,0,0,0.05); color: var(--ink); }

    #transcript {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 700px;
      width: 100%;
      margin: 0 auto;
    }

    #empty {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }
    #empty strong { display: block; font-size: 18px; color: var(--ink); margin-bottom: 6px; }

    .msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.55;
      word-wrap: break-word;
      animation: rise 0.25s ease;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .msg.user {
      align-self: flex-end;
      background: var(--ink);
      color: #fff;
      border-bottom-right-radius: 6px;
      white-space: pre-wrap;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }

    .msg.bot > *:first-child { margin-top: 0; }
    .msg.bot > *:last-child  { margin-bottom: 0; }
    .msg.bot h1, .msg.bot h2, .msg.bot h3 { font-weight: 600; line-height: 1.3; margin: 12px 0 6px; }
    .msg.bot h1 { font-size: 19px; }
    .msg.bot h2 { font-size: 17px; }
    .msg.bot h3 { font-size: 16px; }
    .msg.bot p { margin: 6px 0; }
    .msg.bot ul, .msg.bot ol { padding-left: 22px; margin: 6px 0; }
    .msg.bot li { margin: 2px 0; }
    .msg.bot strong { font-weight: 600; }
    .msg.bot a { color: #2563eb; text-decoration: underline; }
    .msg.bot code {
      background: #f1f1f1; padding: 1px 6px; border-radius: 5px;
      font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 13px;
    }
    .msg.bot pre {
      background: #f4f4f4; padding: 10px 12px; border-radius: 8px;
      overflow-x: auto; margin: 8px 0;
    }
    .msg.bot pre code { background: none; padding: 0; }

    .controls {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 16px 20px 28px;
      background: var(--card);
      border-top: 1px solid var(--border);
    }

    #status {
      font-size: 14px;
      color: var(--muted);
      min-height: 20px;
      transition: color 0.2s;
    }
    #status.error { color: var(--danger); }

    /* Live transcript of what user is saying */
    #live-text {
      font-size: 13px;
      color: var(--ink);
      min-height: 18px;
      max-width: 400px;
      text-align: center;
      opacity: 0.6;
      font-style: italic;
    }

    .mic-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 0;
      background: var(--ink);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s, box-shadow 0.3s;
    }
    .mic-btn:hover:not(:disabled) { background: #333; }
    .mic-btn:active:not(:disabled) { transform: scale(0.94); }
    .mic-btn:disabled { background: #cfcfcf; cursor: default; }

    .mic-btn.listening {
      background: var(--active);
      animation: glow 2s infinite;
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
      50%      { box-shadow: 0 0 0 14px rgba(34, 197, 94, 0); }
    }

    .mic-btn.processing svg { display: none; }
    .mic-btn.processing::after {
      content: "";
      width: 24px; height: 24px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hint { font-size: 12px; color: var(--muted); }

    .unsupported {
      text-align: center;
      padding: 40px 20px;
      color: var(--danger);
      font-size: 15px;
    }

    .text-input-row {
      display: none;
      gap: 8px;
      width: 100%;
      max-width: 500px;
    }
    #voice-text-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 24px;
      font: inherit;
      font-size: 15px;
      outline: none;
      background: var(--bg);
      transition: border-color 0.15s;
    }
    #voice-text-input:focus { border-color: var(--ink); }
    .send-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 0;
      background: var(--ink);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .send-btn:hover { background: #333; }
    .send-btn:disabled { background: #cfcfcf; cursor: default; }
  </style>
</head>
<body>
  <div class="header">
    <a href="/" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
      </svg>
      Текстовый чат
    </a>
    <span class="header-title">CoS — Голос</span>
    <button class="clear-btn" onclick="clearHistory()">Очистить</button>
  </div>

  <div id="transcript"></div>

  <div class="controls" id="controls">
    <div id="status">Нажми, чтобы начать разговор</div>
    <div id="live-text"></div>
    <button class="mic-btn" id="mic-btn" onclick="toggleSession()">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="1" width="6" height="11" rx="3"/>
        <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <div class="hint" id="hint"></div>
    <div class="text-input-row" id="text-input-row">
      <input type="text" id="voice-text-input" placeholder="Напиши сообщение..." autocomplete="off" />
      <button class="send-btn" id="voice-send-btn" onclick="sendTextMessage()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <script>
    // ===== Check browser support =====
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const hasSpeech = !!SpeechRecognition;
    if (!hasSpeech) {
      document.getElementById("mic-btn").style.display = "none";
      document.getElementById("hint").style.display = "none";
      document.getElementById("text-input-row").style.display = "flex";
      document.getElementById("status").textContent = "Голосовой ввод недоступен — пиши текстом";
    }

    // ===== Elements =====
    const STORAGE_KEY = "cos_voice_history";
    const transcriptEl = document.getElementById("transcript");
    const statusEl = document.getElementById("status");
    const micBtn = document.getElementById("mic-btn");
    const liveTextEl = document.getElementById("live-text");
    const hintEl = document.getElementById("hint");

    // ===== State =====
    let messages = [];
    let recognition = null;
    let sessionActive = false;
    let busy = false;
    let currentAudio = null;
    let audioCtx = null;

    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // ===== Markdown =====
    function renderMarkdown(text) {
      return DOMPurify.sanitize(marked.parse(text || "", { breaks: true, gfm: true }));
    }

    // ===== localStorage =====
    function loadHistory() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) messages = JSON.parse(raw);
      } catch {}
    }

    function saveHistory() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(messages)); } catch {}
    }

    function clearHistory() {
      if (messages.length === 0) return;
      if (!confirm("Очистить историю голосового чата?")) return;
      messages = [];
      saveHistory();
      renderTranscript();
    }

    // ===== UI =====
    function updateUI(state, text) {
      statusEl.classList.remove("error");
      micBtn.classList.remove("listening", "processing");
      micBtn.disabled = false;
      hintEl.textContent = "";
      liveTextEl.textContent = "";
      const sendBtn = document.getElementById("voice-send-btn");
      const textInput = document.getElementById("voice-text-input");
      if (sendBtn) sendBtn.disabled = false;
      if (textInput) textInput.disabled = false;

      switch (state) {
        case "idle":
          statusEl.textContent = hasSpeech ? "Нажми, чтобы начать разговор" : "";
          break;
        case "listening":
          statusEl.textContent = "Слушаю... говори свободно";
          micBtn.classList.add("listening");
          hintEl.textContent = "Нажми ещё раз, чтобы завершить";
          break;
        case "processing":
          statusEl.textContent = "Думаю...";
          micBtn.classList.add("processing");
          micBtn.disabled = true;
          if (sendBtn) sendBtn.disabled = true;
          if (textInput) textInput.disabled = true;
          break;
        case "speaking":
          statusEl.textContent = "Говорю...";
          micBtn.disabled = true;
          if (sendBtn) sendBtn.disabled = true;
          if (textInput) textInput.disabled = true;
          break;
        case "error":
          statusEl.textContent = text || "Ошибка";
          statusEl.classList.add("error");
          break;
      }
    }

    function addBubble(role, text) {
      const empty = transcriptEl.querySelector("#empty");
      if (empty) empty.remove();
      const el = document.createElement("div");
      el.className = "msg " + (role === "user" ? "user" : "bot");
      if (role === "user") {
        el.textContent = text;
      } else {
        el.innerHTML = renderMarkdown(text);
      }
      transcriptEl.appendChild(el);
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
      return el;
    }

    function renderTranscript() {
      transcriptEl.innerHTML = "";
      if (messages.length === 0) {
        const empty = document.createElement("div");
        empty.id = "empty";
        const strong = document.createElement("strong");
        strong.textContent = "Голосовой чат с CoS";
        empty.appendChild(strong);
        empty.appendChild(document.createTextNode("Нажми на микрофон и начни говорить свободно."));
        transcriptEl.appendChild(empty);
        return;
      }
      for (const m of messages) addBubble(m.role, m.content);
    }

    // ===== Speech Recognition (browser) =====
    function createRecognition() {
      const rec = new SpeechRecognition();
      rec.lang = "ru-RU";
      rec.continuous = true;
      rec.interimResults = true;

      let finalTranscript = "";
      let silenceTimer = null;

      rec.onresult = (e) => {
        if (busy) return;

        let interim = "";
        finalTranscript = "";

        for (let i = 0; i < e.results.length; i++) {
          const result = e.results[i];
          if (result.isFinal) {
            finalTranscript += result[0].transcript;
          } else {
            interim += result[0].transcript;
          }
        }

        liveTextEl.textContent = finalTranscript + interim;

        // Reset silence timer on any speech
        clearTimeout(silenceTimer);
        if (finalTranscript.trim()) {
          silenceTimer = setTimeout(() => {
            if (finalTranscript.trim() && !busy) {
              const text = finalTranscript.trim();
              rec.stop();
              processVoice(text);
            }
          }, 1500);
        }
      };

      rec.onend = () => {
        // Auto-restart if session is active and not busy
        if (sessionActive && !busy) {
          try { rec.start(); } catch {}
        }
      };

      rec.onerror = (e) => {
        if (e.error === "not-allowed") {
          updateUI("error", "Нет доступа к микрофону. Разреши в настройках браузера.");
          sessionActive = false;
        } else if (e.error !== "no-speech" && e.error !== "aborted") {
          console.warn("Speech recognition error:", e.error);
        }
      };

      return rec;
    }

    // ===== Session =====
    function startSession() {
      if (!SpeechRecognition) return;
      recognition = createRecognition();
      try {
        recognition.start();
        sessionActive = true;
        updateUI("listening");
      } catch (e) {
        updateUI("error", "Не удалось запустить распознавание");
      }
    }

    function stopSession() {
      sessionActive = false;
      if (recognition) {
        recognition.abort();
        recognition = null;
      }
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      updateUI("idle");
    }

    function toggleSession() {
      unlockAudio();
      if (sessionActive) {
        stopSession();
      } else {
        startSession();
      }
    }

    function sendTextMessage() {
      const input = document.getElementById("voice-text-input");
      const text = input.value.trim();
      if (!text || busy) return;
      input.value = "";
      unlockAudio();
      processVoice(text);
    }

    // ===== Voice pipeline: streaming text + sentence-level TTS =====
    async function processVoice(userText) {
      busy = true;
      updateUI("processing");

      addBubble("user", userText);
      messages.push({ role: "user", content: userText });
      saveHistory();

      let botBubble = null;
      let fullText = "";

      // Audio queue for seamless sentence-by-sentence playback
      const audioQueue = [];
      let playing = false;
      let streamEnded = false;
      let playbackDone = null;
      const playbackPromise = new Promise(r => { playbackDone = r; });

      async function drainAudio() {
        if (playing) return;
        playing = true;
        updateUI("speaking");
        while (audioQueue.length > 0) {
          const b64 = audioQueue.shift();
          await playAudio(b64);
        }
        playing = false;
        if (streamEnded && audioQueue.length === 0) {
          playbackDone();
        }
      }

      try {
        const resp = await fetch("/voice/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text: userText,
            messages: messages.slice(0, -1),
          }),
        });

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop();

          for (const part of parts) {
            if (!part.startsWith("data: ")) continue;
            try {
              const data = JSON.parse(part.slice(6));

              if (data.type === "text") {
                fullText += data.chunk;
                if (!botBubble) {
                  botBubble = addBubble("assistant", fullText);
                } else {
                  botBubble.innerHTML = renderMarkdown(fullText);
                }
                transcriptEl.scrollTop = transcriptEl.scrollHeight;
              }

              if (data.type === "audio" && data.data) {
                audioQueue.push(data.data);
                drainAudio();
              }

              if (data.type === "done") {
                messages.push({ role: "assistant", content: data.full_text || fullText });
                saveHistory();
              }

              if (data.type === "error") {
                updateUI("error", data.message);
                busy = false;
                setTimeout(() => {
                  if (sessionActive) resumeListening();
                  else updateUI("idle");
                }, 3000);
                return;
              }
            } catch {}
          }
        }
      } catch (e) {
        updateUI("error", "Ошибка связи с сервером");
        busy = false;
        setTimeout(() => {
          if (sessionActive) resumeListening();
          else updateUI("idle");
        }, 3000);
        return;
      }

      streamEnded = true;
      if (!playing && audioQueue.length === 0) {
        playbackDone();
      }
      await playbackPromise;

      busy = false;
      if (sessionActive) {
        resumeListening();
      } else {
        updateUI("idle");
      }
    }

    function resumeListening() {
      if (!sessionActive) return;
      recognition = createRecognition();
      try {
        recognition.start();
        updateUI("listening");
      } catch {}
    }

    function playAudio(base64Audio) {
      return new Promise(async (resolve) => {
        try {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audioCtx.state === 'suspended') await audioCtx.resume();

          const bytes = Uint8Array.from(atob(base64Audio), c => c.charCodeAt(0));
          const audioBuffer = await audioCtx.decodeAudioData(bytes.buffer.slice(0));
          const source = audioCtx.createBufferSource();
          source.buffer = audioBuffer;
          source.connect(audioCtx.destination);
          source.onended = resolve;
          source.start();
        } catch (e) {
          console.warn("Audio playback error:", e);
          resolve();
        }
      });
    }

    // ===== Init =====
    loadHistory();
    renderTranscript();

    const voiceInput = document.getElementById("voice-text-input");
    if (voiceInput) {
      voiceInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendTextMessage();
        }
      });
    }
  </script>
</body>
</html>
