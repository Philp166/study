<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoS — Голосовой чат</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body class="voice-page">
  <div class="crt-overlay"></div>
  <div class="vignette"></div>

  <div class="header">
    <a href="/" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
      </svg>
      Текстовый чат
    </a>
    <span class="header-title">CoS — Голос</span>
    <button class="clear-btn" onclick="clearHistory()">Очистить</button>
  </div>

  <div id="transcript"></div>

  <div class="controls" id="controls">
    <div id="status">Нажми, чтобы начать разговор</div>
    <div id="live-text"></div>
    <button class="mic-btn" id="mic-btn" onclick="toggleSession()">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="1" width="6" height="11" rx="3"/>
        <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <div class="hint" id="hint"></div>
    <div class="text-input-row" id="text-input-row">
      <input type="text" id="voice-text-input" placeholder="Напиши сообщение..." autocomplete="off" />
      <button class="send-btn" id="voice-send-btn" onclick="sendTextMessage()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const hasSpeech = !!SpeechRecognition;
    if (!hasSpeech) {
      document.getElementById("mic-btn").style.display = "none";
      document.getElementById("hint").style.display = "none";
      document.getElementById("text-input-row").style.display = "flex";
      document.getElementById("status").textContent = "Голосовой ввод недоступен — пиши текстом";
    }

    const API = "";
    const VOICE_CHAT_TITLE = "__voice__";

    const transcriptEl = document.getElementById("transcript");
    const statusEl = document.getElementById("status");
    const micBtn = document.getElementById("mic-btn");
    const liveTextEl = document.getElementById("live-text");
    const hintEl = document.getElementById("hint");

    let chatId = null;
    let messages = [];
    let recognition = null;
    let sessionActive = false;
    let busy = false;
    let currentAudio = null;
    let audioCtx = null;

    async function apiCall(method, path, body) {
      const opts = { method, headers: { "Content-Type": "application/json" } };
      if (body !== undefined) opts.body = JSON.stringify(body);
      const res = await fetch(API + path, opts);
      return res.json();
    }

    async function ensureVoiceChat() {
      const chats = await apiCall("GET", "/api/chats");
      const existing = chats.find(c => c.title === VOICE_CHAT_TITLE);
      if (existing) {
        chatId = existing.id;
      } else {
        const { id } = await apiCall("POST", "/api/chats", { title: VOICE_CHAT_TITLE, model: "claude-haiku-4-5" });
        chatId = id;
      }
      const data = await apiCall("GET", `/api/chats/${chatId}`);
      messages = data.messages || [];
    }

    async function migrateVoiceLocalStorage() {
      const STORAGE_KEY = "cos_voice_history";
      let raw = null;
      try { raw = localStorage.getItem(STORAGE_KEY); } catch {}
      if (!raw) return;
      try {
        const msgs = JSON.parse(raw);
        if (!msgs || msgs.length === 0) return;
        await ensureVoiceChat();
        for (const m of msgs) {
          await apiCall("POST", `/api/chats/${chatId}/messages`, { role: m.role, content: m.content });
        }
        localStorage.removeItem(STORAGE_KEY);
        console.log(`Migrated ${msgs.length} voice message(s) to server.`);
      } catch (e) {
        console.error("Voice migration failed:", e);
      }
    }

    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function renderMarkdown(text) {
      return DOMPurify.sanitize(marked.parse(text || "", { breaks: true, gfm: true }));
    }

    async function clearHistory() {
      if (messages.length === 0) return;
      if (!confirm("Очистить историю голосового чата?")) return;
      if (chatId) {
        await apiCall("DELETE", `/api/chats/${chatId}`);
        chatId = null;
      }
      messages = [];
      await ensureVoiceChat();
      renderTranscript();
    }

    function updateUI(state, text) {
      statusEl.classList.remove("error");
      micBtn.classList.remove("listening", "processing");
      micBtn.disabled = false;
      hintEl.textContent = "";
      liveTextEl.textContent = "";
      const sendBtn = document.getElementById("voice-send-btn");
      const textInput = document.getElementById("voice-text-input");
      if (sendBtn) sendBtn.disabled = false;
      if (textInput) textInput.disabled = false;

      switch (state) {
        case "idle":
          statusEl.textContent = hasSpeech ? "Нажми, чтобы начать разговор" : "";
          break;
        case "listening":
          statusEl.textContent = "Слушаю... говори свободно";
          micBtn.classList.add("listening");
          hintEl.textContent = "Нажми ещё раз, чтобы завершить";
          break;
        case "processing":
          statusEl.textContent = "Думаю...";
          micBtn.classList.add("processing");
          micBtn.disabled = true;
          if (sendBtn) sendBtn.disabled = true;
          if (textInput) textInput.disabled = true;
          break;
        case "speaking":
          statusEl.textContent = "Говорю...";
          micBtn.disabled = true;
          if (sendBtn) sendBtn.disabled = true;
          if (textInput) textInput.disabled = true;
          break;
        case "error":
          statusEl.textContent = text || "Ошибка";
          statusEl.classList.add("error");
          break;
      }
    }

    function addBubble(role, text) {
      const empty = transcriptEl.querySelector("#empty");
      if (empty) empty.remove();
      const el = document.createElement("div");
      el.className = "msg " + (role === "user" ? "user" : "bot");
      if (role === "user") {
        el.textContent = text;
      } else {
        el.innerHTML = renderMarkdown(text);
      }
      transcriptEl.appendChild(el);
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
      return el;
    }

    function renderTranscript() {
      transcriptEl.innerHTML = "";
      if (messages.length === 0) {
        const empty = document.createElement("div");
        empty.id = "empty";
        const strong = document.createElement("strong");
        strong.textContent = "Голосовой чат с CoS";
        empty.appendChild(strong);
        empty.appendChild(document.createTextNode("Нажми на микрофон и начни говорить свободно."));
        transcriptEl.appendChild(empty);
        return;
      }
      for (const m of messages) addBubble(m.role, m.content);
    }

    function createRecognition() {
      const rec = new SpeechRecognition();
      rec.lang = "ru-RU";
      rec.continuous = true;
      rec.interimResults = true;

      let finalTranscript = "";
      let silenceTimer = null;

      rec.onresult = (e) => {
        if (busy) return;

        let interim = "";
        finalTranscript = "";

        for (let i = 0; i < e.results.length; i++) {
          const result = e.results[i];
          if (result.isFinal) {
            finalTranscript += result[0].transcript;
          } else {
            interim += result[0].transcript;
          }
        }

        liveTextEl.textContent = finalTranscript + interim;

        clearTimeout(silenceTimer);
        if (finalTranscript.trim()) {
          silenceTimer = setTimeout(() => {
            if (finalTranscript.trim() && !busy) {
              const text = finalTranscript.trim();
              rec.stop();
              processVoice(text);
            }
          }, 1500);
        }
      };

      rec.onend = () => {
        if (sessionActive && !busy) {
          try { rec.start(); } catch {}
        }
      };

      rec.onerror = (e) => {
        if (e.error === "not-allowed") {
          updateUI("error", "Нет доступа к микрофону. Разреши в настройках браузера.");
          sessionActive = false;
        } else if (e.error !== "no-speech" && e.error !== "aborted") {
          console.warn("Speech recognition error:", e.error);
        }
      };

      return rec;
    }

    function startSession() {
      if (!SpeechRecognition) return;
      recognition = createRecognition();
      try {
        recognition.start();
        sessionActive = true;
        updateUI("listening");
      } catch (e) {
        updateUI("error", "Не удалось запустить распознавание");
      }
    }

    function stopSession() {
      sessionActive = false;
      if (recognition) {
        recognition.abort();
        recognition = null;
      }
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      updateUI("idle");
    }

    function toggleSession() {
      unlockAudio();
      if (sessionActive) {
        stopSession();
      } else {
        startSession();
      }
    }

    function sendTextMessage() {
      const input = document.getElementById("voice-text-input");
      const text = input.value.trim();
      if (!text || busy) return;
      input.value = "";
      unlockAudio();
      processVoice(text);
    }

    async function processVoice(userText) {
      busy = true;
      updateUI("processing");

      addBubble("user", userText);
      messages.push({ role: "user", content: userText });

      let botBubble = null;
      let fullText = "";

      const audioQueue = [];
      let playing = false;
      let streamEnded = false;
      let playbackDone = null;
      const playbackPromise = new Promise(r => { playbackDone = r; });

      async function drainAudio() {
        if (playing) return;
        playing = true;
        updateUI("speaking");
        while (audioQueue.length > 0) {
          const b64 = audioQueue.shift();
          await playAudio(b64);
        }
        playing = false;
        if (streamEnded && audioQueue.length === 0) {
          playbackDone();
        }
      }

      try {
        const resp = await fetch("/voice/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: userText, chat_id: chatId }),
        });

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop();

          for (const part of parts) {
            if (!part.startsWith("data: ")) continue;
            try {
              const data = JSON.parse(part.slice(6));

              if (data.type === "text") {
                fullText += data.chunk;
                if (!botBubble) {
                  botBubble = addBubble("assistant", fullText);
                } else {
                  botBubble.innerHTML = renderMarkdown(fullText);
                }
                transcriptEl.scrollTop = transcriptEl.scrollHeight;
              }

              if (data.type === "audio" && data.data) {
                audioQueue.push(data.data);
                drainAudio();
              }

              if (data.type === "done") {
                messages.push({ role: "assistant", content: data.full_text || fullText });
              }

              if (data.type === "error") {
                updateUI("error", data.message);
                busy = false;
                setTimeout(() => {
                  if (sessionActive) resumeListening();
                  else updateUI("idle");
                }, 3000);
                return;
              }
            } catch {}
          }
        }
      } catch (e) {
        updateUI("error", "Ошибка связи с сервером");
        busy = false;
        setTimeout(() => {
          if (sessionActive) resumeListening();
          else updateUI("idle");
        }, 3000);
        return;
      }

      streamEnded = true;
      if (!playing && audioQueue.length === 0) {
        playbackDone();
      }
      await playbackPromise;

      busy = false;
      if (sessionActive) {
        resumeListening();
      } else {
        updateUI("idle");
      }
    }

    function resumeListening() {
      if (!sessionActive) return;
      recognition = createRecognition();
      try {
        recognition.start();
        updateUI("listening");
      } catch {}
    }

    function playAudio(base64Audio) {
      return new Promise(async (resolve) => {
        try {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audioCtx.state === 'suspended') await audioCtx.resume();

          const bytes = Uint8Array.from(atob(base64Audio), c => c.charCodeAt(0));
          const audioBuffer = await audioCtx.decodeAudioData(bytes.buffer.slice(0));
          const source = audioCtx.createBufferSource();
          source.buffer = audioBuffer;
          source.connect(audioCtx.destination);
          source.onended = resolve;
          source.start();
        } catch (e) {
          console.warn("Audio playback error:", e);
          resolve();
        }
      });
    }

    (async () => {
      await migrateVoiceLocalStorage();
      await ensureVoiceChat();
      renderTranscript();
    })();

    const voiceInput = document.getElementById("voice-text-input");
    if (voiceInput) {
      voiceInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendTextMessage();
        }
      });
    }
  </script>
</body>
</html>
